<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>סוליטר עכביש</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <h1>סוליטר עכביש</h1>
  <div class="stats"><span>מהלכים: <b id="moves">0</b></span><span>⏱ <b id="timer">0:00</b></span></div>
  <div class="btns"><button id="undo">ביטול</button><button id="new-game">חדש</button><button id="add-photos">הוסף תמונות</button><button id="clear-photos" class="hidden">נקה תמונות</button><input type="file" id="photo-input" accept="image/*" multiple hidden></div>
</header>
<main id="table" dir="ltr">
  <div class="top">
    <div class="left">
      <div id="stock" class="pile stock"><span id="stock-count"></span></div>
    </div>
    <div id="foundations" class="foundations"></div>
  </div>
  <div id="tableau" class="tableau"></div>
</main>
<div id="win-dialog" class="dialog hidden">
  <div class="box">
    <h2>ניצחון! 🎉</h2>
    <p id="win-summary"></p>
    <button id="play-again">משחק חדש</button>
    <label><input type="checkbox" id="skip-leave-warning"> בלי אזהרה ביציאה</label>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
